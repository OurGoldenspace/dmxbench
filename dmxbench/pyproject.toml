[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmxbench"
version = "0.1.0"
description = "Audio-to-photon latency measurement for realtime AI lighting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "librosa>=0.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter"]

[tool.setuptools]
packages = ["dmxbench"]
